<touchégg>
  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">10</property>
  </settings>
  <application name="All">
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>sh -lc "$HOME/.config/eww/scripts/panel.sh show"</command>
        <on>begin</on>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>sh -lc "$HOME/.config/eww/scripts/panel.sh hide"</command>
        <on>begin</on>
      </action>
    </gesture>
  </application>
</touchégg>
